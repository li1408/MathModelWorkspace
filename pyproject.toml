[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathmodel-workflow"
version = "0.1.0"
description = "Risk-driven workflow core for Chinese mathematical modeling competitions"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.23",
  "PyYAML>=6.0",
  "pandas>=2.2",
  "openpyxl>=3.1",
]

[tool.setuptools.packages.find]
include = ["workflow_core*", "plugins*", "cases*"]

[tool.unittest]
start-directory = "tests"
